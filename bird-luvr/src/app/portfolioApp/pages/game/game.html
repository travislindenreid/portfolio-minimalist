<body class="container">
  <app-header [title]="gameData().name"></app-header>

  <div class="row">

    <div class="col-md-2"></div>
    <main class="col-md-8 col-sm-12">
        <h2 [innerHTML]="gameData().tagline"></h2>
        <h3>{{gameData().timeframe}}</h3>
        <p [innerHTML]="gameData().content"></p>
        @for(img of gameData().images; track img)
        {
            <img src="{{`/game_images/${img}`}}">
        }
    </main>
    <div class="col-md-2"></div>
    
  </div>

  <app-footer></app-footer>

</body>
