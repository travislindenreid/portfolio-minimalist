<body class="container">
  
  <div class="row">

    <div class="col-md-4"></div>

    <main class="col-md-4 col-sm-12">
      <div class="phoneScreen">

        <div class="phoneTop">
          <div class="topBarTime">{{time}}</div>
          <div class="phoneCamera"></div>
          <div class="topBarSymbols">ᯤ ⛧ ⚧</div>
        </div>

        <h1>Travis Linden Reid</h1>

        <h4>my games</h4>
        <nav>
          @for(game of myGames(); track game)
          {
            <app-game-link [gameData]="game"></app-game-link>
          }
        </nav>
        
        <h4>games I worked on</h4>
        <nav>
          @for(game of otherGames(); track game)
          {
            <app-game-link [gameData]="game"></app-game-link>
          }
        </nav>

        <h4>educator resources</h4>
        <nav>
          <app-app-icon [img_url]="'app_icons/activeLearning.png'" [url]="'activeLearning'"></app-app-icon>
          <app-app-icon [img_url]="'app_icons/activityLibrary.png'" [url]="'activityLibrary'"></app-app-icon>
          <app-app-icon [img_url]="'app_icons/courseLibrary.png'" [url]="'courseLibrary'"></app-app-icon>
        </nav>

        <div class="phoneBottom">
          <app-app-icon [img_url]="'app_icons/birds.png'" [url]="'recentBirds'"></app-app-icon>
          <app-app-icon [img_url]="'app_icons/about.jpg'" [url]="'about'"></app-app-icon>
          <app-app-icon [img_url]="'app_icons/photography.png'" [url]="'photography'"></app-app-icon>
        </div>

      </div>
    </main>

    <div class="col-md-4"></div>
    
  </div>

  <app-footer></app-footer>

</body>
