<body class="container">
  
  <div class="row">

    <div class="col-md-4"></div>

    <main class="col-md-4 col-sm-12">
      <div class="phoneScreen">

        <div class="phoneTop">
          <div class="topBarTime">{{time}}</div>
          <div class="phoneCamera"></div>
          <div class="topBarSymbols">ᯤ ⚧ ⛧</div>
        </div>

        <h1>Travis Linden Reid</h1>

        <div class="myGames">
          @for(game of myGames(); track game)
          {
            <app-game-link [gameData]="game"></app-game-link>
          }
        </div>
        
        <div class="myGames">
          @for(game of otherGames(); track game)
          {
            <app-game-link [gameData]="game"></app-game-link>
          }
        </div>

        <div class="myGames">
          <app-app-icon [img_url]="'app_icons/birds.png'" [url]="'recentBirds'"></app-app-icon>
        </div>

      </div>
    </main>

    <div class="col-md-4"></div>
    
  </div>

  <app-footer></app-footer>

</body>
